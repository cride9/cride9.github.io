<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Károlyi Fórum</title>
<meta name="description" content="A Károlyi Mihály Kollégium közösségi fóruma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="brand">
      <span class="brand-mark">K</span>
      <span class="brand-text">Károlyi Fórum</span>
    </a>

    <div class="header-search">
      <input type="search" id="global-search" placeholder="Keresés a témák között…">
    </div>

    <nav class="header-actions" id="header-actions">
      <!-- betöltve app.js-ből: bejelentkezve / vendég állapot -->
    </nav>

    <button class="menu-toggle" id="menu-toggle" aria-label="Menü">☰</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-block">
      <h2 class="sidebar-title">Kategóriák</h2>
      <ul class="category-list" id="category-list">
        <!-- betöltve app.js-ből -->
      </ul>
    </div>
    <div class="sidebar-block sidebar-note">
      <p>A Károlyi Mihály Kollégium hivatalos, hallgatók által moderált fóruma. Légy tényszerű, légy türelmes — ugyanabban a házban lakunk.</p>
    </div>
  </aside>

  <main class="content" id="app">
    <!-- útvonal szerinti nézet ide töltődik -->
  </main>
</div>

<footer class="site-footer">
  <p>Károlyi Mihály Kollégium Fórum — a kollégium közösségének készült.</p>
</footer>

<template id="tpl-topic-row">
  <li class="topic-row">
    <div class="topic-main">
      <div class="topic-title-line">
        <span class="pin-flag" hidden>Kitűzve</span>
        <span class="lock-flag" hidden>Lezárva</span>
        <a class="topic-title" href="#"></a>
      </div>
      <div class="topic-meta">
        <span class="topic-author"></span>
        <span class="dot">·</span>
        <span class="topic-category"></span>
        <span class="dot">·</span>
        <span class="topic-time"></span>
      </div>
    </div>
    <div class="topic-stats">
      <div class="stat">
        <span class="stat-num topic-replies"></span>
        <span class="stat-label">hozzászólás</span>
      </div>
    </div>
  </li>
</template>

<template id="tpl-post">
  <article class="post">
    <div class="post-side">
      <div class="avatar"></div>
      <div class="post-author"></div>
      <div class="post-role" hidden></div>
    </div>
    <div class="post-body">
      <div class="post-meta">
        <time class="post-time"></time>
        <span class="post-edited" hidden>(szerkesztve)</span>
      </div>
      <div class="post-content"></div>
      <div class="post-actions">
        <button class="link-btn post-reply-btn">Válasz</button>
        <button class="link-btn post-edit-btn" hidden>Szerkesztés</button>
        <button class="link-btn post-delete-btn" hidden>Törlés</button>
        <button class="link-btn post-report-btn">Jelentés</button>
      </div>
    </div>
  </article>
</template>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
