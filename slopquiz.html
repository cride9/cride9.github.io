<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- [1] Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- [2.1] Tailwind CSS Play CDN Script -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- [2.2] Tailwind Configuration Script (AFTER IMPORTING TAILWIND CDN) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- [3] Inline <style> block for custom CSS -->
    <style>
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Style for disabled buttons */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>

    <title>Configurable Quiz Generator</title>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans">
    <!-- [A] Main Card Container -->
    <div class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden transition-all duration-300">
        <!-- [A.1] Header -->
        <header class="bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6 text-center">
            <h1 class="text-3xl font-bold">Configurable Quiz Generator</h1>
            <p class="mt-2 text-blue-100">Customize your quiz and test your knowledge!</p>
        </header>

        <!-- [A.2] Main Content Area -->
        <main class="p-8">
            <!-- [A.2.1] Light/Dark Mode Toggle -->
            <div class="flex justify-end mb-6">
                <button id="themeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:shadow-md transition-all duration-200" aria-label="Toggle dark mode">
                    <!-- Icon will be set by JS -->
                </button>
            </div>

            <!-- [A.2.2] Configuration Screen (Initially Visible) -->
            <div id="configScreen" class="transition-all duration-300">
                <h2 class="text-2xl font-semibold mb-6 text-center">Configure Your Quiz</h2>
                <div class="mb-8">
                    <label class="block text-lg font-medium mb-4">Select Topics:</label>
                    <div id="topicList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Topics generated by JS -->
                    </div>
                </div>
                <div class="mb-8">
                    <label for="questionCount" class="block text-lg font-medium mb-4">Number of Questions:</label>
                    <select id="questionCount" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="5">5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="15">15 Questions</option>
                    </select>
                </div>
                <div class="text-center">
                    <button id="startQuizBtn" class="px-8 py-3 bg-gradient-to-r from-green-500 to-teal-500 text-white font-semibold rounded-lg shadow-md hover:from-green-600 hover:to-teal-600 focus:outline-none focus:ring-2 focus:ring-green-400 transition-all duration-200">
                        Start Quiz
                    </button>
                </div>
            </div>

            <!-- [A.2.3] Quiz Screen (Initially Hidden) -->
            <div id="quizScreen" class="hidden transition-all duration-300">
                <h2 class="text-2xl font-semibold mb-6 text-center">Question <span id="currentQuestionNumber">1</span> of <span id="totalQuestions">0</span></h2>
                <div class="bg-gray-50 dark:bg-gray-700 p-6 rounded-lg mb-6 shadow-inner">
                    <p id="quizQuestion" class="text-xl font-medium"></p>
                </div>

                <div id="alpine-quiz-area"
                     x-data="quizComponent()"
                     @quiz:next-question.window="loadQuestion($event.detail)"
                     class="space-y-4">
                    
                    <template x-if="currentQuestion">
                        <template x-for="(option, index) in currentQuestion.options" :key="index">
                            <label class="block p-4 border rounded-lg cursor-pointer transition-all duration-200"
                                   :class="{
                                       'border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700': !isAnswered,
                                       'cursor-not-allowed': isAnswered,
                                       'bg-green-100 dark:bg-green-900 border-green-500': isAnswered && index === currentQuestion.correctAnswer,
                                       'bg-red-100 dark:bg-red-900 border-red-500': isAnswered && selectedAnswer === index && index !== currentQuestion.correctAnswer,
                                       'border-gray-300 dark:border-gray-600 opacity-70': isAnswered && selectedAnswer !== index && index !== currentQuestion.correctAnswer
                                   }">
                                <input type="radio" name="answer" :value="index" x-model.number="selectedAnswer" @change="submitAnswer()" :disabled="isAnswered" class="sr-only">
                                <span x-text="option" class="ml-2 font-medium"></span>
                            </label>
                        </template>
                    </template>
                </div>

                <div class="flex justify-end mt-8">
                    <button id="nextBtn" class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-all duration-200" disabled>
                        Next Question
                    </button>
                </div>
            </div>

            <!-- [A.2.4] Final Score Screen (Initially Hidden) -->
            <div id="scoreScreen" class="hidden transition-all duration-300">
                <h2 class="text-3xl font-bold text-center mb-4">Quiz Complete!</h2>
                <p class="text-xl text-center mb-8">Your score: <span id="finalScore">0</span> out of <span id="totalScore">0</span></p>
                <div class="w-full bg-gray-300 dark:bg-gray-700 rounded-full h-4 mb-8">
                    <div id="scoreBar" class="bg-gradient-to-r from-green-500 to-teal-500 h-4 rounded-full" style="width: 0%"></div>
                </div>
                <div class="text-center">
                    <button id="restartQuizBtn" class="px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-lg shadow-md hover:from-blue-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all duration-200">
                        Restart Quiz
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- [C] Custom Application Logic in a single <script> tag -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('quizComponent', () => ({
                currentQuestion: null,
                selectedAnswer: null,
                isAnswered: false,
                loadQuestion(question) {
                    this.currentQuestion = question;
                    this.selectedAnswer = null;
                    this.isAnswered = false;
                },
                submitAnswer() {
                    if (this.selectedAnswer === null) return;
                    this.isAnswered = true;
                    // Dispatch an event to let the main script know an answer was submitted
                    window.dispatchEvent(new CustomEvent('quiz:answer', {
                        detail: {
                            isCorrect: this.selectedAnswer === this.currentQuestion.correctAnswer
                        }
                    }));
                }
            }));
        });

        document.addEventListener('DOMContentLoaded', () => {
            const state = {
                questionBank: [
                    { topic: "History", question: "Who was the first President of the United States?", options: ["Thomas Jefferson", "George Washington", "Abraham Lincoln", "John Adams"], correctAnswer: 1 },
                    { topic: "History", question: "In which year did World War II end?", options: ["1944", "1945", "1946", "1943"], correctAnswer: 1 },
                    { topic: "History", question: "Which ancient civilization built the pyramids?", options: ["Romans", "Greeks", "Egyptians", "Mayans"], correctAnswer: 2 },
                    { topic: "Science", question: "What is the chemical symbol for water?", options: ["H2O", "CO2", "O2", "NaCl"], correctAnswer: 0 },
                    { topic: "Science", question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correctAnswer: 1 },
                    { topic: "Science", question: "What is the largest organ in the human body?", options: ["Liver", "Brain", "Skin", "Heart"], correctAnswer: 2 },
                    { topic: "Technology", question: "What does 'HTML' stand for?", options: ["Hyper Text Markup Language", "High Tech Machine Learning", "Hyper Transfer Markup Language", "Home Tool Management Layer"], correctAnswer: 0 },
                    { topic: "Technology", question: "Which company developed the Android operating system?", options: ["Apple", "Microsoft", "Google", "Amazon"], correctAnswer: 2 },
                    { topic: "Technology", question: "What is the primary function of a CPU?", options: ["To store data permanently", "To display graphics", "To execute instructions and perform calculations", "To connect to the internet"], correctAnswer: 2 },
                    { topic: "Geography", question: "What is the capital of France?", options: ["Berlin", "Madrid", "Paris", "Rome"], correctAnswer: 2 },
                    { topic: "Geography", question: "Which is the largest ocean on Earth?", options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], correctAnswer: 3 },
                    { topic: "Geography", question: "Which continent is the largest by area?", options: ["Africa", "Asia", "Europe", "North America"], correctAnswer: 1 },
                    { topic: "Art", question: "Who painted the Mona Lisa?", options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"], correctAnswer: 2 },
                    { topic: "Art", question: "Which art movement is associated with Salvador Dalí?", options: ["Impressionism", "Surrealism", "Cubism", "Expressionism"], correctAnswer: 1 },
                    { topic: "Art", question: "What is the name of the famous sculpture by Auguste Rodin?", options: ["The Thinker", "The Kiss", "The Gates of Hell", "The Burghers of Calais"], correctAnswer: 0 }
                ],
                userConfiguration: { selectedTopics: [], questionCount: 10 },
                generatedQuiz: [],
                currentQuestionIndex: 0,
                score: 0
            };

            const elements = {
                configScreen: document.getElementById('configScreen'),
                quizScreen: document.getElementById('quizScreen'),
                scoreScreen: document.getElementById('scoreScreen'),
                topicList: document.getElementById('topicList'),
                questionCount: document.getElementById('questionCount'),
                startQuizBtn: document.getElementById('startQuizBtn'),
                currentQuestionNumber: document.getElementById('currentQuestionNumber'),
                totalQuestions: document.getElementById('totalQuestions'),
                quizQuestion: document.getElementById('quizQuestion'),
                nextBtn: document.getElementById('nextBtn'),
                finalScore: document.getElementById('finalScore'),
                totalScore: document.getElementById('totalScore'),
                scoreBar: document.getElementById('scoreBar'),
                restartQuizBtn: document.getElementById('restartQuizBtn'),
                themeToggle: document.getElementById('themeToggle')
            };

            function getUniqueTopics() {
                return [...new Set(state.questionBank.map(q => q.topic))];
            }
            
            function shuffleArray(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            }

            function startQuiz() {
                const selectedTopicCheckboxes = document.querySelectorAll('#topicList input[type="checkbox"]:checked');
                state.userConfiguration.selectedTopics = Array.from(selectedTopicCheckboxes).map(cb => cb.value);
                state.userConfiguration.questionCount = parseInt(elements.questionCount.value);

                let filteredQuestions = state.userConfiguration.selectedTopics.length > 0
                    ? state.questionBank.filter(q => state.userConfiguration.selectedTopics.includes(q.topic))
                    : [...state.questionBank];

                state.generatedQuiz = shuffleArray(filteredQuestions).slice(0, state.userConfiguration.questionCount);
                if (state.generatedQuiz.length === 0) {
                    alert("No questions available for the selected topics. Please select at least one topic.");
                    return;
                }
                state.currentQuestionIndex = 0;
                state.score = 0;

                elements.totalQuestions.textContent = state.generatedQuiz.length;
                elements.configScreen.classList.add('hidden');
                elements.quizScreen.classList.remove('hidden');
                elements.scoreScreen.classList.add('hidden');
                renderQuestion();
            }

            function renderQuestion() {
                const question = state.generatedQuiz[state.currentQuestionIndex];
                elements.currentQuestionNumber.textContent = state.currentQuestionIndex + 1;
                elements.quizQuestion.textContent = question.question;

                window.dispatchEvent(new CustomEvent('quiz:next-question', { detail: question }));

                elements.nextBtn.disabled = true;
                elements.nextBtn.textContent = state.currentQuestionIndex === state.generatedQuiz.length - 1 ? 'Show Results' : 'Next Question';
            }

            function showScoreScreen() {
                elements.quizScreen.classList.add('hidden');
                elements.scoreScreen.classList.remove('hidden');

                const total = state.generatedQuiz.length;
                elements.finalScore.textContent = state.score;
                elements.totalScore.textContent = total;
                elements.scoreBar.style.width = `${(state.score / total) * 100}%`;
            }

            function resetQuiz() {
                elements.scoreScreen.classList.add('hidden');
                elements.configScreen.classList.remove('hidden');
                document.querySelectorAll('#topicList input').forEach(cb => cb.checked = false);
            }

            function loadThemePreference() {
                if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                updateThemeIcon();
            }

            function updateThemeIcon() {
                const isDark = document.documentElement.classList.contains('dark');
                elements.themeToggle.innerHTML = `<svg data-lucide="${isDark ? 'sun' : 'moon'}" class="w-5 h-5"></svg>`;
                lucide.createIcons();
            }

            function renderTopics() {
                getUniqueTopics().forEach(topic => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center space-x-2';
                    div.innerHTML = `
                        <input type="checkbox" id="topic-${topic}" value="${topic}" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                        <label for="topic-${topic}" class="text-sm font-medium">${topic}</label>
                    `;
                    elements.topicList.appendChild(div);
                });
            }

            // Event Listeners
            elements.themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                updateThemeIcon();
            });

            elements.startQuizBtn.addEventListener('click', startQuiz);
            elements.restartQuizBtn.addEventListener('click', resetQuiz);

            elements.nextBtn.addEventListener('click', () => {
                if (state.currentQuestionIndex < state.generatedQuiz.length - 1) {
                    state.currentQuestionIndex++;
                    renderQuestion();
                } else {
                    showScoreScreen();
                }
            });
            
            window.addEventListener('quiz:answer', (event) => {
                if (event.detail.isCorrect) {
                    state.score++;
                }
                elements.nextBtn.disabled = false;
            });

            // Initialization
            renderTopics();
            loadThemePreference();
        });
    </script>
</body>
</html>
